name: Check Grindr version

on:
  schedule:
    # Daily at 06:00 UTC. Cheap: just asks APKPure what the latest version is.
    - cron: '0 6 * * *'
  workflow_dispatch:

# Only reading refs here; the decompile job below requests write for its tag.
permissions:
  contents: read

concurrency:
  group: check-grindr-version
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PACKAGE: com.grindrapp.android
      APKEEP_VERSION: 1.0.0
      GH_TOKEN: ${{ github.token }}
    outputs:
      new: ${{ steps.decide.outputs.new }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - name: Install apkeep
        run: |
          case "$(uname -m)" in
            x86_64)        ARCH=x86_64 ;;
            aarch64|arm64) ARCH=aarch64 ;;
            *) echo "::error::unsupported architecture $(uname -m)"; exit 1 ;;
          esac
          curl -fL -o apkeep \
            "https://github.com/EFForg/apkeep/releases/download/${APKEEP_VERSION}/apkeep-${ARCH}-unknown-linux-gnu"
          chmod +x apkeep
          sudo mv apkeep /usr/local/bin/apkeep
          apkeep --version

      - name: Decide whether a new version needs decompiling
        id: decide
        run: |
          set -euo pipefail

          # APKPure supports listing versions without downloading the APK, so this
          # stays quick. Don't trust the listing order — extract every versionName
          # token and take the highest with a version sort.
          echo "::group::apkeep list-versions"
          apkeep -l -a "$PACKAGE" -d apk-pure | tee versions.txt
          echo "::endgroup::"

          latest="$(grep -oE '[0-9]+(\.[0-9]+){1,3}' versions.txt | sort -rV | head -1 || true)"
          if [ -z "$latest" ]; then
            echo "::error::could not parse any version from apkeep output (format may have changed)"
            exit 1
          fi
          echo "Latest available versionName: $latest"
          echo "version=$latest" >> "$GITHUB_OUTPUT"

          # "Already decompiled" == a tag v<versionName>.<build> exists. The
          # trailing dot pins the boundary so 26.10.0 can't match 26.10.01.
          count="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v${latest}." --jq 'length' 2>/dev/null || echo 0)"
          if [ "$count" -gt 0 ]; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "Already decompiled ($count matching tag(s)); nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "New version **$latest** is not yet decompiled — triggering decompile." >> "$GITHUB_STEP_SUMMARY"
          fi

  decompile:
    needs: check
    if: needs.check.outputs.new == 'true'
    # The reusable workflow records a tag, so it needs write granted by us.
    permissions:
      contents: write
    uses: ./.github/workflows/decompile-grindr-apk.yml
