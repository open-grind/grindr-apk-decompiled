name: Decompile Grindr APK

on:
  workflow_dispatch:
  # Invoked once a day by check-grindr-version.yml. Still independently runnable
  # via the Run button. Google Play has no "list versions" API (unlike APKPure),
  # so there is no cheap pre-check: this workflow downloads the current build,
  # reads its real version from the APK manifest, and self-gates on whether that
  # build is already published as a release.
  workflow_call:
    outputs:
      version:
        description: Latest build seen, as versionName.versionCode (e.g. 26.11.0.168192)
        value: ${{ jobs.decompile.outputs.version }}

# contents: write is needed to publish each decompiled build as a GitHub release
# (which also creates its v<version> tag) — the release is the state the gate
# below reads to avoid re-decompiling a build we already have.
permissions:
  contents: write

# Never let a manual run and the scheduled run decompile the same build at once.
concurrency:
  group: decompile-grindr
  cancel-in-progress: false

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.ver.outputs.version }}
      new: ${{ steps.gate.outputs.new }}
    env:
      PACKAGE: com.grindrapp.android
      JADX_VERSION: 1.5.5
      APKEEP_VERSION: 1.0.0
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Install apkeep
        run: |
          # GitHub-hosted ubuntu-latest is x86_64, but pick the matching
          # prebuilt binary so this also runs natively on arm64 runners (and
          # under `act` on Apple Silicon). curl is preinstalled on the runner.
          # SHA-256 pins for apkeep ${APKEEP_VERSION}; update when APKEEP_VERSION changes.
          case "$(uname -m)" in
            x86_64)        ARCH=x86_64;  SHA256=a23579a3ba366d25a6d69848189b983d65662f4ecf4b9e11e16510811659de4e ;;
            aarch64|arm64) ARCH=aarch64; SHA256=5410acebd1b69427adcf98ccfdda6fa4dd3201e0540e5e2c01037b68e0a84049 ;;
            *) echo "::error::unsupported architecture $(uname -m)"; exit 1 ;;
          esac
          curl -fL -o apkeep \
            "https://github.com/EFForg/apkeep/releases/download/${APKEEP_VERSION}/apkeep-${ARCH}-unknown-linux-gnu"
          echo "${SHA256}  apkeep" | sha256sum -c -
          chmod +x apkeep
          sudo mv apkeep /usr/local/bin/apkeep
          apkeep --version

      - name: Download latest build from Google Play
        env:
          GOOGLE_PLAY_EMAIL: ${{ secrets.GOOGLE_PLAY_EMAIL }}
          GOOGLE_PLAY_AAS_TOKEN: ${{ secrets.GOOGLE_PLAY_AAS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_PLAY_EMAIL:-}" ] || [ -z "${GOOGLE_PLAY_AAS_TOKEN:-}" ]; then
            echo "::error::GOOGLE_PLAY_EMAIL / GOOGLE_PLAY_AAS_TOKEN repository secrets are not set. See README for how to mint an AAS token."
            exit 1
          fi
          mkdir -p apks

          # Google Play serves Grindr as an App Bundle (base + config splits), so
          # split_apk=true is required — there is no single monolithic APK to fall
          # back to. apkeep pulls the base plus the splits for the default device
          # profile (px_9a / Pixel 9a, locale en_US, tz UTC); jadx merges them.
          # --accept-tos auto-accepts Play's ToS on a first run with a fresh
          # account. Credentials come from env (never interpolated into the log).
          # Retry purely for network robustness.
          attempt=0
          max=3
          until [ "$attempt" -ge "$max" ]; do
            attempt=$((attempt + 1))
            echo "::group::Attempt ${attempt}/${max}: apkeep google-play download"
            if apkeep -a "$PACKAGE" -d google-play \
                 -e "$GOOGLE_PLAY_EMAIL" -t "$GOOGLE_PLAY_AAS_TOKEN" \
                 --accept-tos -o split_apk=true apks; then
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            echo "Download failed; retrying in 10s..."
            sleep 10
          done

          echo "=== downloaded files ==="
          ls -lhR apks
          if [ -z "$(find apks -type f -name '*.apk' -print -quit)" ]; then
            echo "::error::No APK downloaded from Google Play after ${max} attempts (check credentials, account region, or whether the AAS token expired)."
            exit 1
          fi

      - name: Read app version from the base APK
        id: ver
        run: |
          set -euo pipefail
          # ubuntu-latest ships the Android SDK, so use its aapt2 to read the
          # version WITHOUT a full jadx decompile — that lets the gate below skip
          # the expensive steps for a build we already have. Grindr comes down as
          # base + config splits; the base split is the one whose badging carries
          # a non-empty versionName and no `split=` marker (config splits inherit
          # the versionCode but report an empty versionName).
          AAPT2="$(find "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}/build-tools" -name aapt2 2>/dev/null | sort -V | tail -1 || true)"
          [ -n "$AAPT2" ] && [ -x "$AAPT2" ] || AAPT2="$(command -v aapt2 || true)"
          [ -n "$AAPT2" ] || { echo "::error::aapt2 not found on runner"; exit 1; }
          echo "Using aapt2: $AAPT2"

          name=""
          code=""
          while IFS= read -r f; do
            badge="$("$AAPT2" dump badging "$f" 2>/dev/null || true)"
            if printf '%s\n' "$badge" | grep -q "split="; then
              continue
            fi
            n="$(printf '%s\n' "$badge" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)"
            c="$(printf '%s\n' "$badge" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)"
            if [ -n "$n" ] && [ -n "$c" ]; then
              name="$n"; code="$c"; break
            fi
          done < <(find apks -type f -name '*.apk')

          if [ -z "$name" ] || [ -z "$code" ]; then
            echo "::error::could not read versionName/versionCode from the downloaded APK"
            exit 1
          fi
          version="${name}.${code}"
          echo "versionName=$name  versionCode=$code  ->  $version"
          {
            echo "name=$name"
            echo "code=$code"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Decide whether this build is already decompiled
        id: gate
        run: |
          set -euo pipefail
          # "Already decompiled" == a published RELEASE tagged v<versionName>.<build>
          # exists. Keying off the release (not just the tag) is deliberate: a run
          # that tagged a build but died before publishing must NOT be skipped
          # forever — with no release, the next run retries it.
          version="${{ steps.ver.outputs.version }}"
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "Grindr \`$version\` already decompiled; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "New Grindr build **$version** is not yet decompiled — decompiling." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install build tools
        if: steps.gate.outputs.new == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip file openjdk-17-jre-headless

      - name: Install jadx
        if: steps.gate.outputs.new == 'true'
        run: |
          curl -fL -o jadx.zip \
            "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip"
          # SHA-256 pin for jadx ${JADX_VERSION}; update when JADX_VERSION changes.
          echo "38a5766d3c8170c41566b4b13ea0ede2430e3008421af4927235c2880234d51a  jadx.zip" | sha256sum -c -
          unzip -q jadx.zip -d jadx
          chmod +x jadx/bin/jadx

      - name: Decompile
        if: steps.gate.outputs.new == 'true'
        run: |
          # Hand jadx every APK apkeep produced (base + splits); it merges them
          # into one tree. Flags chosen to recover as much method *logic* as
          # possible. Two distinct jadx failure modes silently drop logic; each
          # flag fixes one. Numbers below are a measured before/after on this app
          # (26.9.2 APK, same input, flags the only change):
          #   --show-bad-code         When jadx produces control-flow it can't restructure into
          #                           valid Java it otherwise emits ONLY `throw new
          #                           UnsupportedOperationException("Method not decompiled")` and
          #                           drops the body. This flag keeps the inconsistent-but-real
          #                           body instead. Effect: methods with no clean Java 6369 ->
          #                           205 (~6.2k bodies recovered). The ~205 residual are mostly
          #                           Kotlin synthetic ctors neither mode can restructure — and
          #                           those still carry a raw-instruction dump (see next).
          #   --comments-level debug  At the default 'info' level jadx skips the body of any
          #                           method over a size threshold entirely, leaving only
          #                           "Method dump skipped ... add '--comments-level debug'" —
          #                           and it's the biggest methods that get cut (e.g. the
          #                           request-signing message builder). At 'debug' level they
          #                           come back as their full raw Dalvik-instruction dump in a
          #                           comment. Effect: fully-skipped bodies 2824 -> 0. Recovered
          #                           form is bytecode, NOT clean Java, but fully traceable.
          #   --no-debug-info         Kept: an obfuscated release build carries ~none, and
          #                           omitting it keeps output stable for cross-version diffing.
          # (Total source grows ~10% from the recovered bodies — a good trade.)
          # Memory is NOT the bottleneck: the jadx launcher already runs at
          # MaxRAMPercentage=70 (~11 GB on the 16 GB runner), so skipped bodies are decompiler
          # limits, not OOM — no -Xmx override needed. -m fallback would recover 100% but as raw
          # instructions for *every* method (unreadable); use it ad hoc on one class, not here.
          mapfile -t INPUTS < <(find apks -type f \( -name '*.xapk' -o -name '*.apk' -o -name '*.apkm' \))
          echo "Decompiling: ${INPUTS[*]}"
          ./jadx/bin/jadx \
            --no-debug-info \
            --show-bad-code \
            --comments-level debug \
            --threads-count 4 \
            -d out "${INPUTS[@]}" || true
          # Recovery signal, build over build. The meaningful number is fully-bodiless
          # methods: with --comments-level debug it should stay ~0 (every method keeps at
          # least its raw instructions); a jump means jadx regressed or hit a new size wall.
          # ("Method not decompiled" is reported too but is only a *clean-Java* miss — those
          # methods still carry a raw-instruction dump above the throw, so it won't hit zero.)
          echo "=== decompile recovery ==="
          echo "fully-skipped bodies (want ~0): $(grep -rho 'Method dump skipped' out/sources 2>/dev/null | wc -l)"
          echo "no clean Java (has raw insns):  $(grep -rho 'Method not decompiled' out/sources 2>/dev/null | wc -l)"
          # `| head` + pipefail/errexit (GitHub's default shell) would fail the
          # step via SIGPIPE once ls outruns head, so swallow the pipe result.
          ls -R out 2>/dev/null | head -n 50 || true

      - name: Drop compiled bytecode and binary / media assets
        if: steps.gate.outputs.new == 'true'
        run: |
          # jadx copies every APK entry it doesn't decode straight into
          # out/resources/. That includes the original classes*.dex (the compiled
          # input we already decompiled into out/sources/, tens of MB each) and
          # resources.arsc (the binary table jadx already decoded into res/values*).
          # Neither is useful for reading or diffing source, so drop them alongside
          # media and fonts.
          find out -type f \( \
            -iname '*.dex'  -o -iname '*.arsc' -o \
            -iname '*.png'  -o -iname '*.jpg'  -o -iname '*.jpeg' -o \
            -iname '*.webp' -o -iname '*.gif'  -o -iname '*.bmp'  -o \
            -iname '*.mp3'  -o -iname '*.mp4'  -o -iname '*.webm' -o \
            -iname '*.ogg'  -o -iname '*.wav'  -o -iname '*.m4a'  -o \
            -iname '*.aac'  -o -iname '*.flac' -o -iname '*.svg'  -o \
            -iname '*.ttf'  -o -iname '*.otf'  -o -iname '*.woff' -o \
            -iname '*.woff2' -o -iname '*.so'  -o \
            -name 'stamp-cert-sha256' \
            \) -delete
          # jadx leaks its own working dir into the output tree; never useful.
          rm -rf out/resources/tmp

      - name: Drop graphical resources, keep values/config XML
        if: steps.gate.outputs.new == 'true'
        run: |
          # res/drawable* and res/mipmap* are presentation assets (vector-drawable
          # XML, shapes, launcher icons), not the static config we care about.
          # These are Android resource *type* directory names — a documented, stable
          # scheme — so matching by name is a principled rule, not a hardcoded path.
          # Everything else (res/values*, res/xml/, res/raw/, layouts, assets/,
          # AndroidManifest.xml) is kept.
          find out -type d \( -iname 'drawable*' -o -iname 'mipmap*' \) \
            -prune -exec rm -rf {} +

      - name: Drop well-known third-party SDKs from sources
        if: steps.gate.outputs.new == 'true'
        run: |
          # Read before editing VENDORS:
          #   * Default is KEEP. We delete only namespaces positively identified as
          #     public third-party SDKs (source available online). Anything we can't
          #     identify — first-party Grindr code AND private/closed deps we can't
          #     re-find elsewhere — is left untouched by construction.
          #   * Entries are reverse-DNS prefixes at vendor-identifying depth
          #     (com/google, io/bidmachine). A reverse-DNS prefix names its owner, so
          #     it cannot collide with first-party code: Grindr won't ship classes
          #     under com/google or androidx.
          #   * NEVER add a bare TLD (com, org, io, net) or com/grindrapp here.
          #   * Use the size report in the next step to spot new vendors per build
          #     and grow this list from data, not by guessing.
          # NOTE ON OBFUSCATION: since 26.10.0 Grindr ships with full-mode R8
          # (repackaging), which flattens most third-party libraries into the root
          # package as obfuscated single-letter classes under out/sources/defpackage/.
          # Those can NO LONGER be matched by their original reverse-DNS namespace,
          # so this denylist only removes the SDKs that R8 left in a named package
          # (e.g. Grindr's keep-rules, or SDKs shaded into their own namespace).
          # defpackage/ is a mix of repackaged Grindr code and repackaged libs and
          # is deliberately kept whole — don't try to bulk-delete it.
          # NOTE: closed-source third-party SDKs are deliberately NOT here. We
          # keep them because their source can't be found online, so this dump is
          # the only way to read them — currently com/facetec, io/agora, ly/img,
          # com/appsflyer, siftscience + com/sift, com/pairip. Don't add them.
          VENDORS=(
            # Google / AndroidX / Kotlin / general OSS plumbing
            androidx
            android/support
            com/google          # GMS, Firebase, gson, protobuf, recaptcha, ...
            com/android
            org/chromium        # Cronet
            kotlin
            kotlinx
            org/jetbrains
            org/intellij
            org/checkerframework
            org/bouncycastle
            com/squareup
            okhttp3
            okio
            retrofit2
            coil3               # image loader
            com/bumptech/glide
            com/airbnb          # Lottie / Epoxy
            io/reactivex
            dagger
            javax/inject
            javax/annotation
            org/apache
            org/json
            io/jsonwebtoken
            io/requery
            io/michaelrocks     # libphonenumber-android / paranoid
            com/jakewharton
            timber
            bolts
            com/getkeepsafe     # relinker
            com/zhuinden        # simple-stack
            dev/zacsweers
            pl/droidsonroids    # gif-drawable
            nl/dionsegijn       # konfetti
            ch/hsr              # geohash
            com/abangfadli
            com/chuckerteam     # chucker
            com/canhub          # image cropper
            com/ketch           # download manager
            com/spotify         # app-remote SDK
            # Ad networks / mediation / measurement (public SDKs)
            com/facebook        # Facebook SDK + com/facebook/ads
            io/bidmachine
            com/mbridge         # Mintegral
            com/ironsource
            com/fyber
            com/digitalturbine
            com/inmobi
            com/unity3d
            gatewayprotocol     # Unity Ads generated protobuf
            com/applovin
            com/explorestack    # Appodeal
            net/pubnative       # Verve
            com/vungle
            com/pubmatic
            com/iab             # IAB OMID / TCF consent
            com/braze           # Braze SDK ...
            bo/app              # ... and its obfuscated runtime package
          )
          for v in "${VENDORS[@]}"; do
            rm -rf "out/sources/$v"
            # Same owners often ship data blobs under assets/ (e.g. libphonenumber
            # metadata); apply the identical denylist there. The */ glob spans the
            # per-split-APK dirs jadx creates from the bundle.
            rm -rf out/resources/*/assets/"$v"
          done

      - name: Prune empty directories
        if: steps.gate.outputs.new == 'true'
        run: find out -type d -empty -delete

      - name: Report remaining namespaces by size
        if: steps.gate.outputs.new == 'true'
        run: |
          # Surfaces the biggest surviving namespaces so new third-party SDKs are
          # easy to spot and add to VENDORS deliberately, from data.
          echo "=== out/sources namespaces by size (depth 2) ==="
          du -h --max-depth=2 out/sources 2>/dev/null | sort -rh | head -n 40 || true
          echo "=== total kept ==="
          du -sh out 2>/dev/null || true

      - name: Compress into a solid zstd archive
        id: pack
        if: steps.gate.outputs.new == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # GitHub always stores artifacts as a zip, and zip compresses each of
          # the ~20k files independently (no shared dictionary). Decompiled source
          # is hugely repetitive across files, so packing everything into one solid
          # stream — tar piped through zstd — roughly halves the result vs the
          # default zip (measured on this app: ~39 MB zip -> ~20 MB). --long=27
          # widens the match window (27 is the largest that still decompresses with
          # a plain `zstd -d`, no special flag); -T0 uses all runner cores. xz -9e
          # is only ~3% smaller for ~3x the CPU, so zstd is the better CI default.
          STAMP="$(date -u +%Y-%m-%d)"
          BASE="${PACKAGE}-${VERSION}-${STAMP}"   # e.g. com.grindrapp.android-26.11.0.168192-2026-07-19
          ARCHIVE="${BASE}.tar.zst"
          tar -C out -cf - . \
            | zstd -19 --long=27 -T0 -o "$ARCHIVE"
          ls -lh "$ARCHIVE"
          # Hand the version+dated names to the upload step (date is UTC).
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "artifact=$BASE"   >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        if: steps.gate.outputs.new == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.pack.outputs.artifact }}
          path: ${{ steps.pack.outputs.archive }}
          # Payload is already compressed; store it (don't let the outer zip that
          # GitHub always adds waste time re-deflating an incompressible blob).
          compression-level: 0
          retention-days: 7

      - name: Publish GitHub release (creates its v<version> tag atomically)
        if: steps.gate.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # No actions/checkout runs in this job, so `gh` has no local git repo to
          # infer the target from — without GH_REPO every `gh release` call dies with
          # "fatal: not a git repository". `gh api` calls elsewhere pass the repo in
          # the path, so they were unaffected; `gh release` needs this.
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.ver.outputs.version }}
          NAME: ${{ steps.ver.outputs.name }}
          CODE: ${{ steps.ver.outputs.code }}
          ARCHIVE: ${{ steps.pack.outputs.archive }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # `gh release create` creates the release AND its v<version> tag in one call
          # (pointing the tag at this run's commit via --target). This is the ONLY step
          # that writes either — done last, on success — so the tag/release always
          # appear together. A run that fails before here leaves neither, and since the
          # gate keys off the *release* (not the tag), the next run retries the
          # version instead of skipping one that was tagged but never published.
          # Notes are passed explicitly (no --generate-notes): just the build line and a
          # link back to this run. GitHub also auto-attaches "Source code" zip/tar.gz to
          # every release with no switch to hide them, so those two can't be suppressed.
          printf '%s\n' \
            "Decompiled Grindr \`$VERSION\` (versionName $NAME, build $CODE)." \
            "" \
            "[GitHub Actions run]($RUN_URL)" > notes.md
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists; updating notes and asset."
            gh release edit "v${VERSION}" --notes-file notes.md
            gh release upload "v${VERSION}" "$ARCHIVE" --clobber
          else
            gh release create "v${VERSION}" "$ARCHIVE" \
              --target "$GITHUB_SHA" \
              --title "v${VERSION}" \
              --notes-file notes.md
          fi
