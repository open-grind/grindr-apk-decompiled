name: Check Grindr version

on:
  schedule:
    # Daily at 06:00 UTC. Downloads the current Google Play build and decompiles
    # it only if we don't already have that versionCode released. Google Play has
    # no cheap "list versions" endpoint, so the worker below downloads first and
    # self-gates on the APK's real manifest version — there's nothing to pre-check
    # here, this workflow just schedules the worker and keeps the cron alive.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-grindr-version
  cancel-in-progress: true

jobs:
  decompile:
    # The reusable worker downloads from Google Play, reads the real version, and
    # publishes a release only when the build is new. It needs the Google Play
    # secrets (passed via `secrets: inherit`) and contents: write for the release.
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/decompile-grindr-apk.yml

  keepalive:
    name: Keep schedule alive
    # A public repo's scheduled workflow is auto-disabled after 60 days with no
    # repository activity, and a workflow run does NOT count as activity. This
    # re-enables the workflow via the GitHub API on every scheduled run (no
    # dummy commits — those risk a ToS violation). Needs only actions: write.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c # v1.2.1
